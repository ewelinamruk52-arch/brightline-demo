<style>
  :root { --d: 34px; }

  .tone-sand { background: #F3EADC; } .tone-mint { background: #D9F0EA; } .tone-lav { background: #E6E0F5; } .tone-blush { background: #FBE1D8; }
  .island { display: grid; grid-template-columns: repeat(2, var(--d)); gap: 4px; padding: 5px; border-radius: 12px; background: rgba(255,255,255,.6); }
  .desk {

  .desk-taken { background-color: #E1534B; background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.2) 0 3px, transparent 3px 7px); color: rgba(255,255,255,.7); }

  .floor.f-team .desk-free, .floor.f-team .desk-taken { opacity: .18; }

  .watch::before, .watch::after { content: ''; position: absolute; left: 50%; width: 120px; height: 46px; transform: translateX(-50%); background: #CFC6EC; border-radius: 14px; z-index: -1; }

  /* ---------- feedback ---------- */

    #desk-panel.open { transform: none; }

  }
  .nfc-ring { position: absolute; inset: 0; border-radius: 999px; border: 2px solid #6CC3B5; animation: nfc 1.8s ease-out infinite; }
  .nfc-ring:nth-child(2) { animation-delay: .6s; } .nfc-ring:nth-child(3) { animation-delay: 1.2s; }
  .desktop-top { transition: transform 1.8s cubic-bezier(.4,0,.2,1); }

  @property --a { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  .bar-fill { transition: width 1s cubic-bezier(.2,.8,.2,1); }
  .tick { transition: color .3s; }

  @keyframes ring { 0%,100% { box-shadow: 0 0 0 3px #6CC3B5, 0 0 10px 1px rgba(108,195,181,.5); } 50% { box-shadow: 0 0 0 3px #6CC3B5, 0 0 20px 5px rgba(108,195,181,.85); } }
  @keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(242,201,76,1); transform: scale(1.25); } 100% { box-shadow: 0 0 0 14px rgba(242,201,76,0); transform: scale(1); } }
  @keyframes pop { 0% { transform: scale(.6); } 100% { transform: scale(1); } }
  @keyframes beacon { 0% { box-shadow: 0 0 0 0 rgba(225,83,75,.7); } 100% { box-shadow: 0 0 0 9px rgba(225,83,75,0); } }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-14px) scale(.96); } to { opacity: 1; transform: none; } }

  @keyframes nfc { from { transform: scale(.6); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
  @keyframes buzz { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-3px) rotate(-1deg); } 75% { transform: translateX(3px) rotate(1deg); } }
  @keyframes spin { to { --a: 360deg; } }

  @media (prefers-reduced-motion: reduce) {

  }

<script>
/* =========================================================
   Brightline – smart hot desking demo (single file)
   Optional: after deploying, put your public link here so the
   QR code always points to it (otherwise the current URL is used).
   ========================================================= */
const PUBLIC_URL = '';

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const pad = n => String(n).padStart(2, '0');
const hhmm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const addMin = (d, m) => new Date(d.getTime() + m * 60000);
const icons = () => { try { window.lucide && lucide.createIcons(); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const rnd = (a, b) => a + Math.random() * (b - a);
const store = {
  get(k, f) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch (e) { return f; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const vibrate = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
const reduceMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- office model (slide 7 + updated map, slide 16) ---------- */
const ZONES = {
  Q: { name: 'Quiet zone', sub: 'By the windows, no calls', n: 12, tone: 'lav' },
  A: { name: 'Zone A', sub: 'Team desks', n: 16, tone: 'sand' },
  B: { name: 'Zone B', sub: 'Kasia’s team, customer service', n: 20, tone: 'mint' },
  C: { name: 'Zone C', sub: 'Team desks', n: 16, tone: 'sand' },
  D: { name: 'Zone D', sub: 'Team desks', n: 16, tone: 'sand' }
};
const DESKS = [];
for (const z of Object.keys(ZONES)) for (let i = 1; i <= ZONES[z].n; i++) DESKS.push(z + pad(i));
const desksOf = z => DESKS.filter(d => d[0] === z);
const TEAM = ['Tomek', 'Ola', 'Marta', 'Piotr'];
const PROTECTED = new Set(['B12']); // keep Kasia's scenario desk free in the live simulation
const HEIGHT = { sit: 72, stand: 110 };

function workDays(n = 5) {
  const out = []; const d = new Date(); d.setHours(0, 0, 0, 0);
  while (out.length < n) { const w = d.getDay(); if (w !== 0 && w !== 6) out.push(new Date(d)); d.setDate(d.getDate() + 1); }
  return out;
}
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dayLabel = d => d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const isToday = d => dayKey(d) === dayKey(new Date());

function genDay(key, first) {
  const r = mulberry32(hash(key));
  const rate = { Q: .5, A: .72, B: .6, C: .66, D: .62 };
  const occ = {};
  for (const id of DESKS) if (r() < rate[id[0]]) occ[id] = 'taken';
  if (first) {
    // The scenario day: B12 free next to Tomek and Ola, 6 free desks in the quiet zone (screen 3)
    delete occ.B12; occ.B11 = 'team:Tomek'; occ.B10 = 'team:Ola'; occ.B14 = 'team:Marta';
    desksOf('Q').forEach((d, i) => { if ([1, 2, 5, 7, 9, 10].includes(i)) delete occ[d]; else occ[d] = 'taken'; });
  } else {
    const b = desksOf('B'); const names = TEAM.slice(0, 2 + Math.floor(r() * 3));
    names.forEach(n => { const id = b[Math.floor(r() * b.length)]; occ[id] = 'team:' + n; });
  }
  return occ;
}

/* ---------- state ---------- */
const now0 = new Date();
const state = {
  view: 'book',
  days: workDays(5),
  dayIdx: 0,
  occ: {},
  mine: store.get('bl.mine', {}),          // { dayKey: { desk, checkedIn } }
  filter: 'all',
  sel: null,                                 // { type:'desk'|'room', id }
  feed: [],
  ventilatedAt: store.get('bl.vent', null),
  breaks: store.get('bl.breaks', 0),
  rooms: [
    { id: 'b1', name: 'Booth 1', kind: 'booth', until: addMin(now0, 18) },
    { id: 'b2', name: 'Booth 2', kind: 'booth', until: null },
    { id: 'b3', name: 'Booth 3', kind: 'booth', until: addMin(now0, 7) },
    { id: 'b4', name: 'Booth 4', kind: 'booth', until: null },
    { id: 'r1', name: 'Meeting room 1', kind: 'room', cap: 6, until: addMin(now0, 52) },
    { id: 'r2', name: 'Meeting room 2', kind: 'room', cap: 8, until: null }
  ],
  myRoom: null,                              // { id, until }
  step: 0, mode: 'after', autoplay: null,
  mgrZone: 'B',
  alertSince: addMin(now0, -17)
};
state.days.forEach((d, i) => state.occ[dayKey(d)] = genDay(dayKey(d), i === 0));
const savedRoom = store.get('bl.room', null);
if (savedRoom && new Date(savedRoom.until) > new Date()) {
  state.myRoom = { id: savedRoom.id, until: new Date(savedRoom.until) };
  const r = state.rooms.find(x => x.id === savedRoom.id); if (r) r.until = state.myRoom.until;
}
// drop bookings on days no longer shown; free those desks in the generated occupancy
for (const k of Object.keys(state.mine)) {
  if (!state.occ[k]) delete state.mine[k]; else delete state.occ[k][state.mine[k].desk];
}
const save = () => { store.set('bl.mine', state.mine); store.set('bl.vent', state.ventilatedAt); store.set('bl.breaks', state.breaks); store.set('bl.room', state.myRoom); };

const curDay = () => state.days[state.dayIdx];
const curKey = () => dayKey(curDay());
const todayKey = () => dayKey(state.days[0]);
function status(id, key = curKey()) {
  const m = state.mine[key]; if (m && m.desk === id) return 'mine';
  const o = state.occ[key][id]; if (!o) return 'free';
  return o.startsWith('team:') ? 'team' : 'taken';
}
const teammateAt = (id, key = curKey()) => { const o = state.occ[key][id]; return o && o.startsWith('team:') ? o.slice(5) : null; };
const islandOf = id => { const z = id[0], n = +id.slice(1); if (z === 'Q') return desksOf('Q').filter(d => Math.abs(+d.slice(1) - n) <= 1 && d !== id); const s = Math.floor((n - 1) / 4) * 4; return [1, 2, 3, 4].map(i => z + pad(s + i)).filter(d => d !== id); };
const bookedCount = (key = todayKey()) => DESKS.filter(d => status(d, key) !== 'free').length;
const freeIn = (z, key = curKey()) => desksOf(z).filter(d => status(d, key) === 'free').length;

/* ---------- sensors (Airthings, one per zone) ---------- */
const SENS = {
  A: { co2: 640, noise: 48, temp: 22.1, t: { co2: 650, noise: 48 } },
  B: { co2: 1400, noise: 68, temp: 23.6, t: { co2: 1410, noise: 67 } },
  C: { co2: 720, noise: 52, temp: 22.4, t: { co2: 730, noise: 52 } },
  D: { co2: 930, noise: 58, temp: 22.9, t: { co2: 940, noise: 58 } },
  Q: { co2: 600, noise: 38, temp: 21.8, t: { co2: 610, noise: 38 } }
};
const HIST = {}; Object.keys(SENS).forEach(z => { HIST[z] = []; let c = SENS[z].co2 * .62; for (let i = 0; i < 36; i++) { c += (SENS[z].co2 - c) * .09 + rnd(-18, 18); HIST[z].push(Math.round(c)); } });
if (state.ventilatedAt) { SENS.B.co2 = 760; SENS.B.noise = 56; SENS.B.t = { co2: 720, noise: 56 }; }
function level(z) { const s = SENS[z]; if (s.co2 >= 1200 || s.noise >= 63) return 'bad'; if (s.co2 >= 900 || s.noise >= 56) return 'warn'; return 'ok'; }
const levelText = { ok: 'Fresh and calm', warn: 'Getting busy', bad: 'Loud and stuffy' };
const alertActive = () => !state.ventilatedAt;

/* ---------- toasts & feed ---------- */
function toast({ title, body = '', icon = 'circle-check', tone = 'ok', action = null }) {
  const tones = { ok: 'bg-plum-800 text-cream-50', warn: 'bg-sun-400 text-plum-900', bad: 'bg-taken text-white', info: 'bg-white text-plum-800 ring-1 ring-plum-800/10' };
  const el = document.createElement('div');
  el.className = `toast w-full sm:w-[360px] rounded-2xl px-4 py-3 shadow-lift flex gap-3 items-start ${tones[tone]}`;

function qrTarget() {
  const saved = store.get('bl.qrurl', '');
  if (saved) return saved;
  if (PUBLIC_URL) return PUBLIC_URL;
  if (/^https?:$/.test(location.protocol) && !/^(localhost|127\.|\[::1\])/.test(location.hostname)) return location.origin + location.pathname;
  return '';
}

  const inFinder = (r, c) => (r < 7 && c < 7) || (r < 7 && c >= n - 7) || (r >= n - 7 && c < 7);
  let cells = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c) && !inFinder(r, c)) cells += `<rect x="${c}" y="${r}" width="1.02" height="1.02" rx=".12"/>`;
  const finder = (x, y) => `<rect x="${x + .5}" y="${y + .5}" width="6" height="6" rx=".9" fill="none" stroke="#2B2440" stroke-width="1"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" rx=".45" fill="#2B2440"/>`;
  return `<svg viewBox="${-m} ${-m} ${n + 2 * m} ${n + 2 * m}" class="w-full h-auto block" role="img" aria-label="QR code linking to ${esc(text)}"><rect x="${-m}" y="${-m}" width="${n + 2 * m}" height="${n + 2 * m}" fill="#fff"/><g fill="#2B2440">${cells}</g>${finder(0, 0)}${finder(n - 7, 0)}${finder(0, n - 7)}</svg>`;
}
function openQR() {
  const url = qrTarget();
  const hasLib = typeof qrcode === 'function';
  $('#overlay').innerHTML = `<div class="fixed inset-0 z-[80] bg-plum-900 text-cream-50 overflow-auto rise" role="dialog" aria-modal="true" aria-label="Scan to try Brightline">
    <div class="absolute -left-24 -bottom-24 w-80 h-80 rounded-full bg-plum-800" aria-hidden="true"></div>
    <div class="absolute right-[8%] top-[10%] w-24 h-24 rounded-full bg-coral-500 hidden md:block" aria-hidden="true"></div>
    <div class="absolute left-[46%] bottom-[12%] w-10 h-10 rounded-full bg-teal-400 hidden md:block" aria-hidden="true"></div>
    <button data-act="close-overlay" class="fixed right-4 top-4 z-10 w-11 h-11 rounded-full bg-plum-700 hover:bg-plum-600 grid place-items-center text-xl" aria-label="Close"><i data-lucide="x"></i></button>
    <div class="relative min-h-full max-w-6xl mx-auto px-4 py-14 grid lg:grid-cols-[1.1fr_1fr] gap-10 lg:gap-16 items-center">
      <div>
        <p class="text-coral-300 font-semibold">Live demo, Group D</p>
        <h2 class="font-display font-extrabold text-5xl sm:text-7xl leading-[0.98] mt-3">Grab your phone. Book a desk.</h2>
        <p class="text-plum-100 text-lg sm:text-xl mt-5 max-w-lg">You are Kasia for a minute. Scan the code, find a green desk next to her team and check in with one tap.</p>
        <ol class="mt-8 space-y-3 text-lg">${['Scan the code with your camera', 'Tap a green desk and book it', 'Tap to check in and watch the desk rise'].map((t, i) => `<li class="flex items-center gap-4"><span class="w-10 h-10 rounded-full ${['bg-coral-500', 'bg-free', 'bg-teal-400 text-plum-900'][i]} grid place-items-center font-display font-bold shrink-0">${i + 1}</span>${t}</li>`).join('')}</ol>
      </div>
      <div class="flex flex-col items-center">
        <div class="qr-frame p-[6px] rounded-[40px] w-full max-w-[420px] shadow-lift">
          <div class="bg-white rounded-[34px] p-6 sm:p-8">${url && hasLib ? qrSVG(url) : `<div class="aspect-square grid place-items-center text-center text-plum-800 p-4"><div><i data-lucide="qr-code" class="text-5xl text-plum-300"></i><p class="font-semibold mt-3">${hasLib ? 'Add your public link to make the code' : 'QR library could not load. Check the internet connection.'}</p><p class="text-sm text-plum-500 mt-1">This page runs locally, so a phone could not open it. Host it (Vercel or GitHub Pages), then paste the link below.</p></div></div>`}</div>
        </div>
        ${url ? `<p class="mt-5 font-display font-semibold text-lg sm:text-xl text-center break-all">${esc(url.replace(/^https?:\/\//, '').replace(/\/$/, ''))}</p>` : ''}
        <div class="mt-4 flex flex-wrap justify-center gap-2">
          ${url ? `<button data-act="copy-url" class="rounded-full bg-plum-700 hover:bg-plum-600 px-4 py-2 text-sm font-semibold inline-flex items-center gap-2"><i data-lucide="copy"></i>Copy link</button>` : ''}
          <button data-act="edit-url" class="rounded-full bg-plum-700 hover:bg-plum-600 px-4 py-2 text-sm font-semibold inline-flex items-center gap-2"><i data-lucide="link"></i>${url ? 'Change link' : 'Add public link'}</button>
        </div>
        <form id="url-form" class="${url ? 'hidden' : ''} mt-4 w-full max-w-[420px] flex gap-2"><label class="sr-only" for="url-in">Public link</label><input id="url-in" type="url" required placeholder="https://your-app.vercel.app" value="${esc(store.get('bl.qrurl', ''))}" class="flex-1 min-w-0 rounded-full bg-white text-plum-800 px-4 py-2.5 text-sm"><button class="rounded-full bg-coral-500 px-4 py-2.5 text-sm font-semibold">Use link</button></form>
      </div>
    </div></div>`;
  icons(); document.body.style.overflow = 'hidden';
  $('#url-form').onsubmit = e => { e.preventDefault(); const v = $('#url-in').value.trim(); store.set('bl.qrurl', v); openQR(); };
  $('#overlay [data-act="close-overlay"]').focus();
}

/* =========================================================
   Events
   ========================================================= */
document.addEventListener('click', e => {
  const t = e.target.closest('button, a, [data-act], [data-backdrop]'); if (!t) return;
  if (t.matches('[data-backdrop]') && e.target === t) { closeOverlay(); return; }
  if (t.dataset.desk) { selectDesk(t.dataset.desk); return; }
  if (t.dataset.room) { state.sel = { type: 'room', id: t.dataset.room }; refreshRooms(); openSheet(); return; }
  if (t.dataset.day) { state.dayIdx = +t.dataset.day; state.sel = null; render(); return; }
  if (t.dataset.filter) { state.filter = t.dataset.filter; render(); return; }
  if (t.dataset.step) { stopAutoplay(); goStep(+t.dataset.step); return; }
  if (t.dataset.mode) { state.mode = t.dataset.mode; stopAutoplay(); render(); return; }
  if (t.dataset.jump) { e.preventDefault(); $('#' + t.dataset.jump).scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth' }); return; }
  if (t.dataset.go) { const g = t.dataset.go; if (g.startsWith('#')) location.hash = g; else { state.step = STEPS.findIndex(s => s.screen === g); state.mode = 'after'; if (location.hash === '#day') render(); else location.hash = '#day'; } return; }
  const k = todayKey();
  switch (t.dataset.act) {
    case 'hide-hint': store.set('bl.seenHint', true); $('#hint').remove(); break;
    case 'near-team': { const id = nearTeam(); if (!id) { toast({ title: 'No free desks that day', icon: 'info', tone: 'warn' }); break; } selectDesk(id, { scroll: true }); const el = $(`[data-desk="${id}"]`); el && el.classList.add('flash'); toast({ title: `${id} is next to your team`, body: islandOf(id).map(n => teammateAt(n)).filter(Boolean).join(' and ') ? `You would sit next to ${islandOf(id).map(n => teammateAt(n)).filter(Boolean).join(' and ')}.` : 'Closest free desk to your team.', icon: 'users', tone: 'info' }); break; }
    case 'book': bookDesk(t.dataset.id); break;
    case 'cancel': cancelBooking(); break;
    case 'checkin': openCheckin(); break;
    case 'do-tap': doTap(); break;
    case 'tip': overlay(`<div class="w-full max-w-md bg-cream-50 rounded-[32px] p-6 shadow-lift relative" role="dialog" aria-modal="true"><button data-act="close-overlay" class="absolute right-4 top-4 w-9 h-9 rounded-full bg-white grid place-items-center" aria-label="Close"><i data-lucide="x"></i></button><h2 class="font-display font-bold text-2xl mb-4">Your setup tip</h2>${tipHTML()}<button data-act="close-overlay" class="mt-5 w-full rounded-full bg-plum-800 text-cream-50 py-3.5 font-semibold">Done</button></div>`); break;
    case 'close-overlay': closeOverlay(); break;
    case 'close-panel': closeSheet(); break;
    case 'book-room': bookRoom(t.dataset.id, +t.dataset.min); break;
    case 'end-room': endRoom(); break;
    case 'qr': openQR(); break;
    case 'copy-url': try { navigator.clipboard.writeText(qrTarget()); toast({ title: 'Link copied', icon: 'copy', tone: 'info' }); } catch (err) {} break;
    case 'edit-url': $('#url-form').classList.toggle('hidden'); $('#url-in').focus(); break;
    case 'autoplay': toggleAutoplay(); break;
    case 'prev-step': stopAutoplay(); goStep(state.step - 1); break;
    case 'next-step': stopAutoplay(); goStep(state.step + 1); break;
    case 'book-b12': if (!(state.mine[k] && state.mine[k].desk === 'B12')) bookDesk(status('B12', k) === 'free' ? 'B12' : nearTeam(k), k); renderStage(); break;
    case 'near-team-day': { const id = nearTeam(k); id && bookDesk(id, k); renderStage(); break; }
    case 'release-day': cancelBooking(k); renderStage(); break;
    case 'show-team': state.filter = 'team'; state.dayIdx = 0; break;
    case 'watch-done': state.breaks++; save(); vibrate([120, 80, 120]); toast({ title: 'Nice, you stood up', body: 'Next reminder in about an hour, never during a call.', icon: 'droplet' }); renderStage(); break;
    case 'watch-later': vibrate(60); toast({ title: 'Reminder in 15 minutes', body: 'It waits until your call or meeting ends.', icon: 'clock', tone: 'info' }); break;
    case 'move-quiet': { const q = desksOf('Q').find(d => status(d, k) === 'free'); if (q) { const was = state.mine[k]; state.mine[k] = { desk: q, checkedIn: was ? was.checkedIn : false }; save(); toast({ title: `Moved to ${q}, quiet zone`, body: `Desk set to ${HEIGHT.sit} cm. ${was ? was.desk + ' is free for others.' : ''}`, icon: 'leaf' }); feed(`You moved to the quiet zone (${q})`, 'leaf'); } renderStage(); break; }
    case 'stay': toast({ title: 'OK, staying in zone B', body: 'No more alerts for this zone for an hour.', icon: 'bell-off', tone: 'info' }); break;
    case 'ventilate': ventilate(); break;
    case 'export': exportReport(); break;
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'mgr-zone') { state.mgrZone = e.target.value; $('#spark').innerHTML = sparkline(state.mgrZone); $('#week').innerHTML = weekBars(state.mgrZone); $$('#week [data-w]').forEach(x => x.style.width = x.dataset.w + '%'); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#overlay').innerHTML) closeOverlay(); else closeSheet(); }
  if ((e.key === 'q' || e.key === 'Q') && !/input|textarea|select/i.test(document.activeElement.tagName) && !e.metaKey && !e.ctrlKey) openQR();
});
$('#qr-btn').onclick = openQR;
$('#reset-demo').onclick = () => { ['bl.mine', 'bl.vent', 'bl.breaks', 'bl.room', 'bl.seenHint'].forEach(store.del); location.hash = '#book'; location.reload(); };
window.addEventListener('hashchange', route);

/* =========================================================
   Live simulation: other people booking, sensors, booths
   ========================================================= */
function simDesks() {
  const k = todayKey(); const occ = state.occ[k];
  const pct = bookedCount(k) / DESKS.length;
  const selId = state.sel && state.sel.type === 'desk' ? state.sel.id : null;
  const pool = DESKS.filter(d => d[0] !== 'Q' && !PROTECTED.has(d) && d !== selId);
  let id, msg, icon;
  if (pct < 0.8 && Math.random() < 0.6) {
    const free = pool.filter(d => status(d, k) === 'free'); if (!free.length) return;
    id = free[Math.floor(Math.random() * free.length)]; occ[id] = 'taken'; msg = `${id} was booked in ${ZONES[id[0]].name}`; icon = 'calendar-plus';
  } else {
    const taken = pool.filter(d => status(d, k) === 'taken'); if (!taken.length) return;
    id = taken[Math.floor(Math.random() * taken.length)]; delete occ[id];
    msg = Math.random() < .5 ? `${id} released: nobody checked in` : `${id} is free again`; icon = 'circle-dot';
  }
  feed(msg, icon);
  if (state.view === 'book' && state.dayIdx === 0) { refreshBook([id]); const el = $(`[data-desk="${id}"]`); el && el.classList.add('flash'); }
  $('#live-count').textContent = bookedCount();
}
function simSensors() {
  for (const z of Object.keys(SENS)) {
    const s = SENS[z];
    s.co2 += (s.t.co2 - s.co2) * (z === 'B' && state.ventilatedAt ? .22 : .12) + rnd(-14, 14);
    s.noise += (s.t.noise - s.noise) * .2 + rnd(-1.2, 1.2);
    s.temp += rnd(-.05, .05);
    HIST[z].push(Math.round(s.co2)); if (HIST[z].length > 36) HIST[z].shift();
  }
  $$('[data-sensor]').forEach(el => { const [z, f] = el.dataset.sensor.split('-'); el.textContent = Math.round(SENS[z][f]); });
  $$('[data-lv]').forEach(el => { el.className = 'lv lv-' + level(el.dataset.lv); });
  $$('[data-lvtext]').forEach(el => { const z = el.dataset.lvtext; el.textContent = `${levelText[level(z)]}, ${SENS[z].temp.toFixed(1)} °C`; });
  $$('[data-tile]').forEach(el => { const lv = level(el.dataset.tile); el.classList.remove('border-free/50', 'border-sun-400', 'border-taken'); el.classList.add({ ok: 'border-free/50', warn: 'border-sun-400', bad: 'border-taken' }[lv]); });
  const sp = $('#spark'); if (sp) sp.innerHTML = sparkline(state.mgrZone);
}
function simRooms() {
  const nowT = new Date(); let changed = false;
  for (const r of state.rooms) {
    if (r.until && r.until <= nowT) {
      r.until = null; changed = true;
      if (state.myRoom && state.myRoom.id === r.id) { state.myRoom = null; save(); toast({ title: `Your time in ${r.name} is over`, body: 'The booth is free for the next call.', icon: 'phone-off', tone: 'info' }); }
      else feed(`${r.name} is free again`, 'phone');
    } else if (!r.until && r.kind === 'booth' && Math.random() < .08 && !(state.sel && state.sel.id === r.id)) {
      r.until = addMin(nowT, 10 + Math.floor(Math.random() * 20)); changed = true; feed(`${r.name} booked for a call`, 'phone');
    }
  }
  if (changed) refreshRooms();
  else $$('[data-roomstatus]').forEach(el => { const r = state.rooms.find(x => x.id === el.dataset.roomstatus); const mine = state.myRoom && state.myRoom.id === r.id; if (r.until && !mine) el.textContent = `In use, free in ${roomLeft(r)} min`; });
  const bu = $('#booth-use'); if (bu) bu.textContent = state.rooms.filter(r => r.kind === 'booth' && r.until).length + '/4';
}
(function loopDesks() { setTimeout(() => { simDesks(); loopDesks(); }, 6000 + Math.random() * 6000); })();
setInterval(simSensors, 2500);
setInterval(simRooms, 5000);

/* ---------- start ---------- */
feed('Zone B sensor: loud and stuffy for 17 min', 'activity');
feed(`${bookedCount()} of 80 desks booked for today`, 'map');
route();
if (/[?&]present\b/.test(location.search)) openQR();
</script>
